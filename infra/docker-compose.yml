# n8n + PostgreSQL self-hosted para Monitoreo Cloud (EC2 t3.micro, Amazon Linux 2023).
# Persistencia en contenedor postgres (costo $0 indefinido). Secretos vía .env del host (NO versionado).
# Ver .env.example en la raíz del repo. Estándares: docs/n8n-aws-standards.md §4-§5.
services:
  postgres:
    image: postgres:16.4-alpine          # versión fijada (no 'latest')
    container_name: n8n-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.118.0   # versión fijada (no 'latest')
    container_name: n8n
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      # --- Autenticación básica ---
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      # --- Host / red ---
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${N8N_HOST}:5678/
      - GENERIC_TIMEZONE=America/Mexico_City
      # --- Clave de cifrado de credenciales ---
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # --- Backend de base de datos: PostgreSQL en contenedor (servicio 'postgres') ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST:-postgres}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      # --- Región AWS para nodos que usen el rol IAM de la instancia ---
      - AWS_REGION=${AWS_REGION:-us-east-2}
      # --- n8n inserta las métricas en la tabla 'metrics' de este mismo PostgreSQL
      #     (nodo Postgres del workflow); Grafana la lee como datasource. ---
    volumes:
      - n8n_data:/home/node/.n8n
    # Límite acorde a t3.micro (1 vCPU / 1 GB). Con swap evita OOM dejando margen a postgres + host.
    mem_limit: 500m

  grafana:
    image: grafana/grafana-oss:11.3.1   # versión fijada (no 'latest')
    container_name: grafana
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://${N8N_HOST}:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
    mem_limit: 300m

volumes:
  n8n_data:
    driver: local
  pg_data:
    driver: local
  grafana_data:
    driver: local
